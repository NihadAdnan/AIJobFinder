<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Glass Overlay -->
  <rect x="9" y="9" width="82" height="82" rx="20" fill="#0f172a" fill-opacity="0.3" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Briefcase & AI Neural Lattice Core -->
  <path d="M 36 34 C 36 30.7 38.7 28 42 28 L 58 28 C 61.3 28 64 30.7 64 34 L 64 36 L 36 36 Z" fill="none" stroke="url(#glowGrad)" stroke-width="3" stroke-linecap="round" />
  
  <rect x="26" y="36" width="48" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Target Radar Ring -->
  <circle cx="50" cy="53" r="11" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
  <circle cx="50" cy="53" r="4" fill="#ffffff" />

  <!-- AI Sparks / Nodes -->
  <circle cx="28" cy="24" r="3.5" fill="#38bdf8" />
  <circle cx="72" cy="24" r="3.5" fill="#c084fc" />
  <line x1="28" y1="24" x2="36" y2="34" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="72" y1="24" x2="64" y2="34" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2 2" />
</svg>
